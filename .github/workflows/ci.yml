name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Run unit test suite (Vitest)
        run: npm run test

      - name: Run integration & validation test suite
        run: npm run test:suite

      - name: Run production build (Vite)
        run: npm run build

      - name: Dependency security audit
        run: npm audit --audit-level=high
